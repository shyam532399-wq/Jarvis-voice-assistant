name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Repo me .zip ho to sabse naya zip unzip hota hai,
      # warna repo ki files seedhe use hoti hain.
      - name: Find project (unzip if needed)
        id: project
        run: |
          set -euo pipefail
          base="$PWD"
          zip_file=""
          best=-1
          while IFS= read -r -d '' z; do
            t="$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)"
            t="${t:-0}"
            if [ "$t" -ge "$best" ]; then best="$t"; zip_file="$z"; fi
          done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print0 | sort -z)

          if [ -n "$zip_file" ]; then
            echo "Using zip: $zip_file"
            rm -rf "$PWD/_project"
            mkdir -p "$PWD/_project"
            unzip -oq "$zip_file" -d "$PWD/_project" || [ $? -eq 1 ]
            base="$PWD/_project"
          else
            echo "No zip found, using repo files"
          fi

          settings="$(find "$base" -maxdepth 4 -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path '*/.git/*' | awk -F/ '{ print NF " " $0 }' | sort -n | sed -n 1p | cut -d' ' -f2-)"
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts nahi mila. Project zip ya files repo me upload karo."
            find . -maxdepth 3 -not -path './.git/*' | sed -n 1,100p
            exit 1
          fi

          dir="$(dirname "$settings")"
          echo "Gradle project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --version
          gradle assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: JarvisAssistant-debug-apk
          path: ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
